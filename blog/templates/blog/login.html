{% extends 'blog/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

    <h1>Login</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>

    <p style="margin-top:15px;">
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
    </p>

{% endblock %}
